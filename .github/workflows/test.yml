# Action versions are pinned to full semver for reproducible CI; update intentionally.
name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check for code changes
      id: changes
      uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
      with:
        filters: |
          code:
            - 'a8_validate/**'
            - 'validate_directory.py'
            - 'scripts/**'
            - 'requirements*.txt'
            - 'pyproject.toml'
            - 'pytest.ini'
            - '.github/workflows/**'
    - name: Set up Python ${{ matrix.python-version }}
      if: steps.changes.outputs.code == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'
        cache-dependency-path: |
          requirements.txt
          requirements-test.txt

    - name: Install dependencies
      if: steps.changes.outputs.code == 'true'
      run: |
        python -m pip install -r requirements-test.txt

    - name: Run tests with coverage
      if: steps.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
      run: |
        python -m pytest -v --tb=short --cov=a8_validate --cov-report=xml --cov-report=html --cov-report=term

    - name: Run tests
      if: steps.changes.outputs.code == 'true' && matrix.os != 'ubuntu-latest'
      run: |
        python -m pytest -v --tb=short

    - name: Skip message
      if: steps.changes.outputs.code != 'true'
      run: |
        echo "Skipping tests - only documentation files changed"

    - name: Upload coverage report
      if: steps.changes.outputs.code == 'true' && matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report
        path: htmlcov/
