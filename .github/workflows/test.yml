# Action versions are pinned to immutable SHAs; Dependabot maintains release comments.
name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ${{ github.event_name == 'pull_request' && fromJSON('["ubuntu-latest", "windows-latest"]') || fromJSON('["ubuntu-latest", "macos-latest", "windows-latest"]') }}
        python-version: ['3.12']

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check for code changes
      id: changes
      uses: dorny/paths-filter@3bd38cc694a599310d33c96ebf3bc41001fab4a9 # v4.0.3
      with:
        filters: |
          code:
            - 'a8_validate/**'
            - 'validate_directory.py'
            - 'scripts/**'
            - 'requirements*.txt'
            - 'pytest.ini'
            - '.github/workflows/**'
          docs:
            - '*.md'
            - 'LICENSE'
            - 'CONTRIBUTING.md'
            - 'CODE_OF_CONDUCT.md'
            - 'SECURITY.md'
            - '.cursorrules'
            - '.vscode/**'

    - name: Set up Python ${{ matrix.python-version }}
      if: steps.changes.outputs.code == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      if: steps.changes.outputs.code == 'true'
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests
      if: steps.changes.outputs.code == 'true'
      run: |
        python -m pytest -v --tb=short -n auto

    - name: Skip message
      if: steps.changes.outputs.code != 'true'
      run: |
        echo "Skipping tests - only documentation files changed"

    - name: Upload test results
      if: steps.changes.outputs.code == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.python-version }}
        path: .pytest_cache/
        if-no-files-found: ignore
