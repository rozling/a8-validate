# Action versions are pinned to immutable SHAs; Dependabot maintains release comments.
name: Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Check for code changes
      id: changes
      uses: dorny/paths-filter@3bd38cc694a599310d33c96ebf3bc41001fab4a9 # v4.0.3
      with:
        filters: |
          code:
            - 'a8_validate/**'
            - 'validate_directory.py'
            - 'scripts/**'
            - 'requirements*.txt'
            - 'pytest.ini'
            - '.github/workflows/**'
          docs:
            - '*.md'
            - 'LICENSE'
            - 'CONTRIBUTING.md'
            - 'CODE_OF_CONDUCT.md'
            - 'SECURITY.md'
            - '.cursorrules'
            - '.vscode/**'

    - name: Set up Python
      if: steps.changes.outputs.code == 'true'
      uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install dependencies
      if: steps.changes.outputs.code == 'true'
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Run tests with coverage
      if: steps.changes.outputs.code == 'true'
      run: |
        python -m pytest --cov=a8_validate --cov-report=xml --cov-report=html --cov-report=term -n auto

    - name: Skip message
      if: steps.changes.outputs.code != 'true'
      run: |
        echo "Skipping coverage - only documentation files changed"

    - name: Upload coverage report
      if: steps.changes.outputs.code == 'true'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: coverage-report
        path: htmlcov/
